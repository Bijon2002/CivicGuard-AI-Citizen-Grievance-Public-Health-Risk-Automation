services:
  - type: web
    name: civicguard-fastapi-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: APP_NAME
        value: CivicGuard AI
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        value: sqlite:///./civicguard.db
      - key: SUPABASE_URL
        value: https://oezknuwiteyqpmrevhzh.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: reports
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: EXTRA_API_KEY
        sync: false
      - key: STORAGE_ROOT
        value: storage
      - key: OPEN_METEO_TIMEOUT_SECONDS
        value: "15"
      - key: ALLOWED_ORIGINS
        value: "*"
